# =============================================================================
#  Камера MJSXJ05CM (OpenIPC, 192.168.30.53): кнопки PTZ
# =============================================================================
#  На камере busybox httpd :8080 + CGI (репо mjsxj05cm-research, p4/ptz-cgi.sh):
#  ?left=N ?right=N ?up=N ?down=N — полушаги (пан ≈11.4/°, тилт ≈7.3/°), ?home — в центр
#  как у стока (≈20 с). Ответ `ok` сразу, движение фоном; `busy` — мотор ещё едет.
#  Без auth: сегмент Cam доступен только из Home/WG. Перезагрузка HA не нужна:
#  Developer tools → YAML → «REST commands» и «Template entities».
#  11.10: ночной режим. input_select «авто/ночь/день» + пороги усиления; автоматизация сама приводит камеру
#  к выбранному (и после её перезагрузки: cam-up.sh поднимает «авто» без порогов). Ручной режим =
#  /api/v1/set?nightMode.lightMonitor=false + /night/on|off (проверено вживую, конвейер не пересобирается).
#  Порог ночи 1x = решает экспозиция (как по умолчанию); N>1 = ночь при усилении ≥N, день при ≤ порога дня.
#  Root-пароль: secrets.yaml → mjsxj05cm_root. Перечитать: YAML → «REST commands», «REST entities»,
#  «Input selects», «Input numbers», «Automations»; кнопки ночь/день убраны (их заменил селектор).
# =============================================================================
rest_command:
  mjsxj05cm_ptz:
    url: "http://192.168.30.53:8080/cgi-bin/ptz?{{ cmd }}"
    timeout: 5
  mjsxj05cm_night:
    url: "http://192.168.30.53/night/{{ cmd }}"
    username: root
    password: !secret mjsxj05cm_root
    timeout: 5
  mjsxj05cm_set:
    url: "http://192.168.30.53/api/v1/set?{{ q }}"
    username: root
    password: !secret mjsxj05cm_root
    timeout: 10

input_select:
  mjsxj05cm_night_mode:
    name: "Камера: ночной режим"
    options: [авто, ночь, день]
    icon: mdi:theme-light-dark

input_number:
  mjsxj05cm_night_gain:
    name: "Камера: ночь при усилении, x (1 = по экспозиции)"
    min: 1
    max: 64
    step: 1
    icon: mdi:weather-night
  mjsxj05cm_day_gain:
    name: "Камера: день при усилении, x"
    min: 2
    max: 32
    step: 1
    icon: mdi:white-balance-sunny

automation:
  - id: mjsxj05cm_night_apply
    alias: "Камера: применить ночной режим"
    mode: queued
    max: 3
    triggers:
      # камера не совпадает с выбранным (смена селектора, ребут камеры, рестарт HA)
      - trigger: template
        value_template: >-
          {%- set m = states('input_select.mjsxj05cm_night_mode') %}
          {%- set src = states('sensor.mjsxj05cm_night_source') %}
          {%- set thr = states('sensor.mjsxj05cm_day_threshold') %}
          {%- set g = states('input_number.mjsxj05cm_night_gain') | int(1) %}
          {%- if src in ['unknown', 'unavailable'] %}false
          {%- elif m == 'авто' %}{{ src != 'авто' or (g > 1) != (thr != 'нет') }}
          {%- else %}{{ src != 'вручную' or states('sensor.mjsxj05cm_night') != m }}{% endif %}
      - trigger: state
        entity_id: [input_number.mjsxj05cm_night_gain, input_number.mjsxj05cm_day_gain]
    actions:
      - variables:
          m: "{{ states('input_select.mjsxj05cm_night_mode') }}"
      - action: rest_command.mjsxj05cm_set
        data:
          q: >-
            nightMode.lightMonitor={{ 'true' if m == 'авто' else 'false' }}&nightMode.autoNightGain={{
            states('input_number.mjsxj05cm_night_gain') | int(1) }}&nightMode.autoDayGain={{
            states('input_number.mjsxj05cm_day_gain') | int(4) }}
      - if: "{{ m != 'авто' }}"
        then:
          - action: rest_command.mjsxj05cm_night
            data: {cmd: "{{ 'on' if m == 'ночь' else 'off' }}"}
      - action: homeassistant.update_entity
        target: {entity_id: sensor.mjsxj05cm_night}

template:
  - button:
      - name: "Камера: влево"
        unique_id: mjsxj05cm_ptz_left
        default_entity_id: button.mjsxj05cm_ptz_left
        icon: mdi:arrow-left-bold
        press:
          - action: rest_command.mjsxj05cm_ptz
            data: {cmd: "left=300"}
      - name: "Камера: вправо"
        unique_id: mjsxj05cm_ptz_right
        default_entity_id: button.mjsxj05cm_ptz_right
        icon: mdi:arrow-right-bold
        press:
          - action: rest_command.mjsxj05cm_ptz
            data: {cmd: "right=300"}
      - name: "Камера: вверх"
        unique_id: mjsxj05cm_ptz_up
        default_entity_id: button.mjsxj05cm_ptz_up
        icon: mdi:arrow-up-bold
        press:
          - action: rest_command.mjsxj05cm_ptz
            data: {cmd: "up=100"}
      - name: "Камера: вниз"
        unique_id: mjsxj05cm_ptz_down
        default_entity_id: button.mjsxj05cm_ptz_down
        icon: mdi:arrow-down-bold
        press:
          - action: rest_command.mjsxj05cm_ptz
            data: {cmd: "down=100"}
      - name: "Камера: в центр"
        unique_id: mjsxj05cm_ptz_home
        default_entity_id: button.mjsxj05cm_ptz_home
        icon: mdi:image-filter-center-focus
        press:
          - action: rest_command.mjsxj05cm_ptz
            data: {cmd: "home"}

rest:
  - resource: http://192.168.30.53/metrics
    username: root
    password: !secret mjsxj05cm_root
    authentication: basic
    scan_interval: 60
    timeout: 10
    sensor:
      - name: mjsxj05cm_night
        unique_id: mjsxj05cm_night
        icon: mdi:theme-light-dark
        value_template: >-
          {{ 'ночь' if value | regex_findall('(?m)^night_enabled ([0-9]+)') | first | default('0') == '1' else 'день' }}
      - name: mjsxj05cm_night_source
        unique_id: mjsxj05cm_night_source
        icon: mdi:auto-mode
        value_template: >-
          {%- set v = value | regex_findall('(?m)^night_mode_source ([0-9]+)') | first | default('') %}
          {{ {'0': 'вручную', '4': 'авто'}.get(v, v or 'unknown') }}
      - name: mjsxj05cm_day_threshold
        unique_id: mjsxj05cm_day_threshold
        icon: mdi:white-balance-sunny
        value_template: >-
          {%- set t = value | regex_findall('(?m)^night_day_threshold_milli ([0-9]+)') %}
          {{ (t[0] | int / 1000) if t else 'нет' }}
      - name: mjsxj05cm_temperature
        unique_id: mjsxj05cm_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        value_template: "{{ value | regex_findall('(?m)^node_hwmon_temp_celsius ([0-9.]+)') | first }}"
      - name: mjsxj05cm_ram_free
        unique_id: mjsxj05cm_ram_free
        icon: mdi:memory
        state_class: measurement
        unit_of_measurement: "MB"
        value_template: "{{ ((value | regex_findall('(?m)^node_memory_MemAvailable_bytes ([0-9]+)') | first | int) / 1048576) | round(1) }}"
      - name: mjsxj05cm_wifi_rssi
        unique_id: mjsxj05cm_wifi_rssi
        device_class: signal_strength
        state_class: measurement
        unit_of_measurement: "dBm"
        value_template: "{{ value | regex_findall('(?m)^wifi_rssi_dbm (-?[0-9]+)') | first }}"
      - name: mjsxj05cm_gain
        unique_id: mjsxj05cm_gain
        icon: mdi:brightness-6
        state_class: measurement
        unit_of_measurement: "x"
        value_template: >-
          {%- set a = value | regex_findall('(?m)^isp_again ([0-9]+)') | first | int %}
          {%- set d = value | regex_findall('(?m)^isp_dgain ([0-9]+)') | first | int %}
          {{ (a * d / 1048576) | round(1) }}
      - name: mjsxj05cm_card_used
        unique_id: mjsxj05cm_card_used
        icon: mdi:sd
        state_class: measurement
        unit_of_measurement: "%"
        value_template: "{{ value | regex_findall('(?m)^records_storage_used_percent ([0-9]+)') | first }}"
      - name: mjsxj05cm_majestic_started
        unique_id: mjsxj05cm_majestic_started
        device_class: timestamp
        value_template: "{{ (value | regex_findall('(?m)^app_boot_time_seconds ([0-9]+)') | first | int) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}"
